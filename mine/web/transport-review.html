<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка новых маршрутов — Кенташ</title><link rel="stylesheet" href="style.css"><style>body{display:block;background:#141b22;margin:0}header{height:100px;padding:12px;color:#ddd}.stage{position:absolute;inset:105px 0 0}.labelhost{position:absolute;inset:0;pointer-events:none}button,select{margin:4px;padding:7px}#rom-loader-status{display:block}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script><header><b>Проверка новых маршрутов · отдельный расчёт, рабочая симуляция не изменяется</b><div><label>Этап <select id="stage"></select></label><button id="high">Сверху</button><button id="back">Обратная сторона</button><button id="detail">Общий вид</button></div><span id="rom-loader-status"></span></header><div class="stage" id="cr"><div class="scenehost" id="scene-cr" style="inset:0"></div><div class="labelhost" id="labels-cr"></div></div><div class="stage" id="rom" hidden><div class="scenehost" id="scene-rom" style="inset:0"></div><div class="labelhost" id="labels-rom"></div></div><script type="module">
import {T} from './store.js';import {CrushScene} from './crush3d.js';import {RomScene} from './rom3d.js';
const d=await (await fetch('./transport-review.json')).json();for(const [id,a] of Object.entries(d.attrs))T[id]={attributes:a,features:{},units:{}};
const names={cr_turn:'ККД: очередь и заезд',cr_reverse:'ККД: подача задним ходом',cr_raise:'ККД: подъём кузова',dumping:'ККД: разгрузка',cr_lower:'ККД: опускание кузова',cr_exit:'ККД: выезд',rom_loading:'Склад: настоящий самосвал под погрузчиком'};
const select=document.getElementById('stage');for(const id of Object.keys(d.frames)){const o=document.createElement('option');o.value=id;o.textContent=names[id]||id;select.appendChild(o);}
let scenes={},current;
function show(){const f=d.frames[select.value];for(const [id,v] of Object.entries(f.features))if(T[id])T[id].features=v;T.mine.features.speed=0;
for(const id of ['cr','rom'])document.getElementById(id).hidden=id!==f.scene;
if(!scenes[f.scene]){const cls=f.scene==='cr'?CrushScene:RomScene;scenes[f.scene]=new cls(document.getElementById('scene-'+f.scene),document.getElementById('labels-'+f.scene),()=>{});}
current=scenes[f.scene];current.setActive(true);current.update();current.view(f.scene==='cr'?'all':'delivery');if(f.scene==='cr'){current.camera.position.set(-155,130,155);current.controls.target.set(-65,0,10);}current.controls.update();}
select.onchange=show;show();document.getElementById('high').onclick=()=>{if(current===scenes.cr){current.camera.position.set(-85,250,0);current.controls.target.set(-85,0,0);current.controls.update();}else current.view('top');};document.getElementById('back').onclick=()=>{if(current===scenes.cr){current.camera.position.set(90,100,120);current.controls.target.set(-60,0,0);current.controls.update();}else current.view('back');};document.getElementById('detail').onclick=show;
function tick(){current.frame();requestAnimationFrame(tick);}tick();
</script></html>
