<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка движения АЗС — изолированный стенд</title><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script><link rel="stylesheet" href="./style.css"><style>body{margin:0}header{height:72px;padding:8px;background:#172029;color:white}#scene-fs{height:calc(100vh - 72px);width:100vw}#labels{position:absolute;inset:72px 0 0;pointer-events:none}.lbl{pointer-events:auto}button{margin:3px}</style><header><b>Изолированная проверка АЗС · команды в симулятор не отправляются</b><br><span id="cams"></span><select id="phase" aria-label="Фаза движения"></select></header><div id="scene-fs"></div><div id="labels"></div><script type="module">
import {FuelScene} from './fac3d.js';import {T} from './store.js';import {updateFuel} from './fuel-details.js';
const frames=await fetch('./review-fuel-frames.json').then(r=>r.json());
for(const id of ['fs-site','fuel-station','fs-tanker','fs-tank-1','fs-tank-2','fs-disp-1','fs-disp-2','mine'])T[id]={attributes:{name:id},features:{level_pct:50}};
T.mine.features.speed=1;const scene=new FuelScene(document.getElementById('scene-fs'),document.getElementById('labels'),()=>{});scene.setActive(true);scene.ensure();
for(const key of Object.keys(scene.views)){const b=document.createElement('button');b.textContent=key;b.onclick=()=>scene.view(key);document.getElementById('cams').append(b);}
const sel=document.getElementById('phase');for(const f of frames){const o=document.createElement('option');o.textContent=f.name;sel.append(o);}function show(){const f=frames[sel.selectedIndex];T['fuel-station'].features.traffic=JSON.stringify(f.traffic);T['fs-tanker'].features.state=f.traffic.tanker.phase;scene.motionInitialized=false;scene.update();updateFuel(scene,0);}
sel.onchange=show;show();scene.view('all');window.addEventListener('error',e=>{document.title='ОШИБКА: '+e.message});
</script></html>
