<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кенташ — проект дороги</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script>
<style>html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:#10161d;color:#eef2f6;font-family:system-ui}header{padding:12px 16px;background:#18232d}header strong{font-size:18px}header p{margin:5px 0;font-size:13px;color:#becad5}.toolbar{position:static;transform:none;margin:0;display:flex;flex-wrap:wrap;gap:6px;padding:10px}#design-stage{position:relative;flex:1;min-height:0}#design-canvas,#design-labels{position:absolute;inset:0}#design-labels{pointer-events:none}#design-labels .sp-tip{pointer-events:none}#status{padding:8px 16px;font-size:13px;background:#18232d}a{color:#9dccfa}label{display:flex;align-items:center;gap:5px;padding:0 8px}button.active{border-color:#72b8ec}</style></head>
<body><header><strong>Кенташ · проект дороги и площадок</strong><p>Статический просмотр нового проекта. Текущая симуляция продолжает работать отдельно.</p><p>Съезд: 34 м · проезжая часть: 28 м · заезды: 22 м · уклон: до 9% · горизонтальные примыкания: 80 м</p></header>
<nav class="toolbar"><button data-camera="pit">Общий вид</button><button data-camera="top">Сверху</button><button data-camera="ramp">Съезд</button><button data-camera="F1">Забой F1</button><button data-camera="F2">Забой F2</button><button data-camera="F3">Забой F3</button><label><input type="checkbox" id="design-label-toggle">Все подписи</label><label>Цикл погрузки <input type="range" id="design-phase" min="0" max="30" value="15" step=".2"></label><label>Геология <select id="pit-geo"><option value="3d">3D-карьер</option><option value="plan">Горизонт Cu</option><option value="slice-x">Разрез X</option><option value="slice-y">Разрез Y</option></select></label><span id="pit-geo-extra" hidden><select id="pit-level" aria-label="Горизонт"><option value="0">0…−15 м</option><option value="1">−15…−30 м</option><option value="2">−30…−45 м</option><option value="3">−45…−60 м</option><option value="4">−60…−75 м</option><option value="5">−75…−90 м</option></select><input type="range" id="pit-slice" aria-label="Сечение" value="0"><span id="pit-geo-value"></span></span><a href="/">Вернуться к руднику</a></nav>
<main id="design-stage"><div id="design-canvas"></div><div id="design-labels"></div></main><footer id="status">Загрузка проекта…</footer>
<script type="module" src="road-design-preview.js"></script></body></html>
